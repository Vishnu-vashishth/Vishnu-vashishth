<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="Vishnu Vashishth — backend engineer, distributed systems">
<defs><pattern id="sc" width="4" height="4" patternUnits="userSpaceOnUse">
<rect width="4" height="1.1" fill="#0D1F14" opacity=".55"/></pattern></defs>
<style>
 .nm{font:700 40px ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;fill:#4ADE80;letter-spacing:-1px}
 .pr{font:700 40px ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;fill:#1F7A45}
 .rl{font:500 12.5px ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;fill:#FACC15;letter-spacing:2.2px}
 .sk{font:400 11.5px ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;fill:#5E9C78;letter-spacing:1.2px}
 .lgt{font:400 11px ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;fill:#5E9C78;letter-spacing:.4px}
 .ok{font:400 11px ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;fill:#4ADE80}
 .ms{font:400 11px ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;fill:#FACC15;opacity:.85}
 .cu{fill:#4ADE80;animation:bl 1.05s steps(1) infinite}
 .tick{animation:tk 3.4s ease-in-out infinite}
 .scan{animation:sn 5.5s ease-in-out infinite}
 @keyframes bl{0%,49%{opacity:1}50%,100%{opacity:0}}
 @keyframes tk{0%,100%{opacity:1}50%{opacity:.4}}
 @keyframes sn{0%,100%{transform:translateY(0)}50%{transform:translateY(78px)}}
 @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1000" height="240" rx="14" fill="#060A07"/>
<rect width="1000" height="240" rx="14" fill="url(#sc)"/>
<rect x=".5" y=".5" width="999" height="239" rx="14" fill="none" stroke="#13301F"/>
<text class="pr" x="52" y="102">~$</text>
<text class="nm" x="112" y="102">vishnu-vashishth</text>
<rect class="cu" x="507" y="74" width="15" height="34"/>
<text class="rl" x="52" y="142">BACKEND ENGINEER :: DISTRIBUTED SYSTEMS</text>
<text class="sk" x="52" y="170">payments · microservices · gRPC · AI infrastructure</text>
<text class="lgt" x="600" y="62" fill="#1F7A45" opacity=".75">~$ tail -f services.log</text><rect class="scan" x="596" y="78" width="364" height="20" rx="4" fill="#4ADE80" opacity=".06"/><g><text class="ok tick" x="600" y="90" style="animation-delay:0.00s">✓</text><text class="lgt" x="622" y="90">payment.webhook</text><text class="ms" x="812" y="90">settled</text><text class="lgt" x="918" y="90" opacity=".7">12ms</text></g><g><text class="ok tick" x="600" y="115" style="animation-delay:0.42s">✓</text><text class="lgt" x="622" y="115">grpc.checkout</text><text class="ms" x="812" y="115">scope ok</text><text class="lgt" x="918" y="115" opacity=".7">4ms</text></g><g><text class="ok tick" x="600" y="140" style="animation-delay:0.84s">✓</text><text class="lgt" x="622" y="140">subscription</text><text class="ms" x="812" y="140">renewed</text><text class="lgt" x="918" y="140" opacity=".7">31ms</text></g><g><text class="ok tick" x="600" y="165" style="animation-delay:1.26s">✓</text><text class="lgt" x="622" y="165">telemetry.flush</text><text class="ms" x="812" y="165">1.2k events</text><text class="lgt" x="918" y="165" opacity=".7"></text></g></svg>